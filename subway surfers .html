<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Runners 3D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            background: linear-gradient(to bottom, #111122 0%, #222244 50%, #443355 100%);
            display: block;
        }

        .ui-text {
            position: absolute;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #score-board {
            top: 20px;
            left: 20px;
            font-size: 20px;
            color: #00ffcc;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #game-over-screen h1 {
            color: #ff3366;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .btn {
            background: #00ffcc;
            color: #111;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
            background: #fff;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="subwayCanvas" width="450" height="600"></canvas>
    <div id="score-board" class="ui-text">SCORE: <span id="score">0</span></div>
    
    <div id="game-over-screen">
        <h1>WASTED</h1>
        <p>You crashed into a train!</p>
        <p>Score: <span id="final-score">0</span></p>
        <button class="btn" onclick="resetGame()">RUN AGAIN</button>
    </div>
</div>

<script>
    const canvas = document.getElementById("subwayCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const gameOverScreen = document.getElementById("game-over-screen");
    const finalScoreEl = document.getElementById("final-score");

    // Game Constants
    const HORIZON_Y = 250; 
    const LANE_WIDTH_BOTTOM = 140; 
    const LANES = [-1, 0, 1]; // Left, Center, Right

    // Game Variables
    let currentLane = 1; // 0=Left, 1=Center, 2=Right
    let targetLaneX = 1;
    let playerLaneX = 1; // Smoothed movement interpolation
    let playerY = 0;
    let playerVelocityY = 0;
    let playerHeightState = "normal"; // normal, jumping, ducking
    let duckTimer = 0;

    let gameSpeed = 0.05;
    let score = 0;
    let isGameOver = false;
    let obstacles = [];
    let environmentTick = 0;

    // Control configuration
    const gravity = 0.6;
    const jumpForce = 12;

    class Obstacle {
        constructor() {
            this.lane = Math.floor(Math.random() * 3); // Random lane
            this.z = 1.0; // Starts far away at horizon (1.0 to 0.0)
            this.type = Math.random() > 0.4 ? "train" : "barrier"; // Two obstacle types
        }

        update() {
            this.z -= gameSpeed; // Moves forward closer to camera
        }

        draw() {
            if (this.z <= 0) return;

            // Perspective Calculations
            const scale = 1 / this.z; 
            const vanishingX = canvas.width / 2;
            const laneOffset = (this.lane - 1) * LANE_WIDTH_BOTTOM;
            
            // X position maps along perspective lines
            const screenX = vanishingX + (laneOffset * (1 - this.z));
            const screenY = HORIZON_Y + ((canvas.height - HORIZON_Y) * (1 - this.z));

            ctx.save();
            ctx.translate(screenX, screenY);

            if (this.type === "train") {
                // Draw a 3D-looking Subway Train
                let w = 80 * (1 - this.z);
                let h = 130 * (1 - this.z);
                
                // Front Face
                ctx.fillStyle = "#ff5500";
                ctx.fillRect(-w/2, -h, w, h);
                // Windshield
                ctx.fillStyle = "#33ccff";
                ctx.fillRect(-w/3, -h + 15 * (1-this.z), (w/3)*2, h/4);
                // Headlights
                ctx.fillStyle = "#ffff00";
                ctx.fillRect(-w/2.5, -20 * (1-this.z), 10 * (1-this.z), 10 * (1-this.z));
                ctx.fillRect(w/2.5 - 10*(1-this.z), -20 * (1-this.z), 10 * (1-this.z), 10 * (1-this.z));
                
                this.hitbox = { x: screenX - w/2, y: screenY - h, w: w, h: h, type: "high" };
            } else {
                // Draw a Low Yellow Traffic Barrier
                let w = 60 * (1 - this.z);
                let h = 35 * (1 - this.z);
                
                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(-w/2, -h, w, h);
                ctx.fillStyle = "#111";
                ctx.fillRect(-w/2, -h + 10*(1-this.z), w, 8*(1-this.z));
                
                this.hitbox = { x: screenX - w/2, y: screenY - h, w: w, h: h, type: "low" };
            }
            ctx.restore();
        }
    }

    // Input Handling
    window.addEventListener("keydown", (e) => {
        if (isGameOver) return;

        if ((e.key === "ArrowLeft" || e.key.toLowerCase() === "a") && currentLane > 0) {
            currentLane--;
        }
        if ((e.key === "ArrowRight" || e.key.toLowerCase() === "d") && currentLane < 2) {
            currentLane++;
        }
        if ((e.key === "ArrowUp" || e.key === " ") && playerHeightState === "normal") {
            playerHeightState = "jumping";
            playerVelocityY = jumpForce;
        }
        if (e.key === "ArrowDown" && playerHeightState === "normal") {
            playerHeightState = "ducking";
            duckTimer = 15; // Duck duration frames
        }
    });

    function spawnObstacles() {
        environmentTick++;
        // Spawn interval gets progressively shorter
        let spawnRate = Math.max(30, 80 - Math.floor(score / 50));
        if (environmentTick % spawnRate === 0) {
            obstacles.push(new Obstacle());
        }
    }

    function checkCollisions(obs) {
        if (!obs.hitbox || obs.z > 0.15 || obs.z < 0.03) return false;

        // Player dynamic width/height representation at the foreground
        let pW = 40;
        let pH = playerHeightState === "ducking" ? 25 : 60;
        let pX = (canvas.width / 2) + ((currentLane - 1) * LANE_WIDTH_BOTTOM) - pW / 2;
        let pY = canvas.height - 30 - playerY - pH;

        // Collision logic bounding box matrix
        let hitX = pX < obs.hitbox.x + obs.hitbox.w && pX + pW > obs.hitbox.x;
        let hitY = pY < obs.hitbox.y + obs.hitbox.h && pY + pH > obs.hitbox.y;

        if (hitX && hitY) {
            // Mechanics: Jumping clears low barriers, but crashes into trains
            if (obs.type === "barrier" && playerHeightState === "jumping") return false;
            // Mechanics: Ducking cannot save you from hitting a direct full train head-on
            return true;
        }
        return false;
    }

    function drawTracks() {
        // Draw standard pseudo-3D perspective ground tracks
        const vX = canvas.width / 2;
        
        ctx.strokeStyle = "#555577";
        ctx.lineWidth = 3;
        
        LANES.forEach((l) => {
            let offset = l * LANE_WIDTH_BOTTOM;
            ctx.beginPath();
            ctx.moveTo(vX, HORIZON_Y);
            ctx.lineTo(vX + offset, canvas.height);
            ctx.stroke();
        });
    }

    function drawPlayer() {
        // Linearly smooth out transition across lanes
        playerLaneX += (currentLane - playerLaneX) * 0.25;

        const currentLaneOffset = (playerLaneX - 1) * LANE_WIDTH_BOTTOM;
        const screenX = (canvas.width / 2) + currentLaneOffset;
        let screenY = canvas.height - 35 - playerY;

        ctx.save();
        ctx.translate(screenX, screenY);

        // Render Player Avatar Model (Hoverboard theme style)
        if (playerHeightState === "ducking") {
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(-15, -25, 30, 25); // squished profile box
        } else {
            // Legs/Body
            ctx.fillStyle = "#3333ff";
            ctx.fillRect(-12, -45, 24, 25);
            // Jacket
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(-15, -60, 30, 20);
            // Head
            ctx.fillStyle = "#ffcc99";
            ctx.beginPath();
            ctx.arc(0, -68, 10, 0, Math.PI * 2);
            ctx.fill();
        }

        // Hoverboard base plate glow design
        ctx.fillStyle = "#00ffcc";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#00ffcc";
        ctx.fillRect(-20, -5, 40, 7);

        ctx.restore();
    }

    function resetGame() {
        isGameOver = false;
        score = 0;
        gameSpeed = 0.04;
        obstacles = [];
        currentLane = 1;
        playerLaneX = 1;
        playerY = 0;
        playerVelocityY = 0;
        playerHeightState = "normal";
        gameOverScreen.style.display = "none";
        animate();
    }

    // Main Game Execution Loop
    function animate() {
        if (isGameOver) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
